name: Beta release
run-name: Beta ${{ inputs.tag || github.ref_name }}${{ github.event_name == 'workflow_dispatch' && !inputs.publish && ' (build only)' || '' }}

on:
  push:
    tags:
      - 'v*-beta.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Beta tag matching DockNest.csproj, for example v0.1.7-beta.1'
        required: true
        type: string
      publish:
        description: 'Publish a GitHub pre-release (unchecked: build downloadable artifacts only)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: beta-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: Check and package Windows x64
    runs-on: windows-2022
    timeout-minutes: 25
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source and tags
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate beta version
        id: version
        env:
          BETA_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $metadata = & ./.github/scripts/Get-BetaVersion.ps1 -Tag $env:BETA_TAG
          "tag=$($metadata.Tag)" >> $env:GITHUB_OUTPUT
          "version=$($metadata.Version)" >> $env:GITHUB_OUTPUT

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      - name: Run checks without desktop integration
        run: dotnet run --project Tests/DockNest.Checks.csproj -c Release -- --ci artifacts/verification/ci

      - name: Build ZIP packages and checksums
        env:
          BETA_TAG: ${{ steps.version.outputs.tag }}
        run: ./.github/scripts/Build-BetaPackage.ps1 -Tag $env:BETA_TAG

      - name: Upload packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: beta-packages
          path: artifacts/beta/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

      - name: Upload check results and UI previews
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: beta-check-results
          path: |
            artifacts/verification/ci/*-result.json
            artifacts/verification/ci/*.png
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

      - name: Write build summary
        if: success()
        env:
          BETA_TAG: ${{ steps.version.outputs.tag }}
          BETA_VERSION: ${{ steps.version.outputs.version }}
        run: |
          @"
          ## DockNest $env:BETA_VERSION
          - Tag: $env:BETA_TAG
          - Windows x64: self-contained and framework-dependent ZIP packages.
          - SHA256SUMS.txt and both READMEs are included.
          - Download the beta-packages artifact from this run.
          - Desktop docking, tray and focus checks still require a local Windows session.
          "@ >> $env:GITHUB_STEP_SUMMARY

  release:
    name: Publish GitHub pre-release
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the tested commit and tags
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download tested packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: beta-packages
          path: artifacts/beta

      - name: Publish beta assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BETA_TAG: ${{ needs.build.outputs.tag }}
        run: ./.github/scripts/Publish-BetaRelease.ps1 -Tag $env:BETA_TAG
